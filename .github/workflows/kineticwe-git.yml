name: "kineticwe-git - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:

env:
  APP_NAME:       "kineticwe-git"
  GITLAB_PROJECT: "theblackdon/kineticwe"
  BRANCH:         "kineticwe-2.0"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/kineticwe-git.spec"
  CHROOTS:        "fedora-44-x86_64 fedora-45-x86_64 fedora-rawhide-x86_64"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest commit (kineticwe-2.0)
        id: upstream
        run: |
          set -euo pipefail
          API="https://gitlab.com/api/v4/projects/theblackdon%2Fkineticwe/repository/commits?ref_name=${{ env.BRANCH }}&per_page=1"
          COMMIT=$(curl -fsSL --retry 3 "$API")
          SHA=$(jq -r '.[0].id' <<<"$COMMIT")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA from GitLab: $SHA"; exit 1; }
          DATE=$(jq -r '.[0].committed_date' <<<"$COMMIT" | cut -c1-10 | tr -d '-')
          SHORT="${SHA:0:8}"
          VER="${DATE}.git${SHORT}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $VER ($SHORT)"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("2026.09.24.gitXXXXXXXX-1");
          # buang suffix-nya agar cocok dengan commit upstream saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget curl jq
          pip install copr-cli --quiet

      - name: Download source tarball (from GitLab commit SHA)
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          SHA="${{ steps.upstream.outputs.sha }}"
          FILENAME="${{ env.APP_NAME }}-${VER}.tar.gz"
          curl -fsSL --retry 3 \
            "https://gitlab.com/${{ env.GITLAB_PROJECT }}/-/archive/${SHA}/${FILENAME}" \
            -o "$FILENAME"
          # GitLab archives have a "<project>-<ref>-<sha>" top dir; rename so %setup matches.
          mkdir -p extract
          tar -xzf "$FILENAME" -C extract
          mapfile -t TOP < <(find extract -mindepth 1 -maxdepth 1 -type d)
          [ "${#TOP[@]}" -eq 1 ] || { echo "expected 1 top dir, got ${#TOP[@]}"; exit 1; }
          mv "${TOP[0]}" "${{ env.APP_NAME }}-${VER}"
          tar -czf "$FILENAME" "${{ env.APP_NAME }}-${VER}"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          echo "▶ Downloaded $FILENAME ($SHA)"

      - name: Download pinned refs and auxiliary sources
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          SHA="${{ steps.upstream.outputs.sha }}"
          SPEC="${{ env.SPEC_FILE }}"
          mkdir -p ~/rpmbuild/SOURCES

          # Pinned dependency refs live in the vendored spec (single source of truth).
          KGA_REF=$(sed -n 's/.*%global kglobalacceld_ref \([0-9a-f]\{40\}\).*/\1/p' "$SPEC" | head -1)
          KDECO_REF=$(sed -n 's/.*%global kdecoration_ref \([0-9a-f]\{40\}\).*/\1/p' "$SPEC" | head -1)
          KCFG_REF=$(sed -n 's/.*%global kconfig_compiler_ref \([0-9a-f]\{40\}\).*/\1/p' "$SPEC" | head -1)
          GR_REF=$(sed -n 's/.*%global noctalia_greeter_ref \([0-9a-f]\{40\}\).*/\1/p' "$SPEC" | head -1)
          for R in "$KGA_REF" "$KDECO_REF" "$KCFG_REF" "$GR_REF"; do
            [[ "$R" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid pinned ref in spec: $R"; exit 1; }
          done

          curl -fsSL --retry 3 \
            "https://invent.kde.org/plasma/kglobalacceld/-/archive/${KGA_REF}/kglobalacceld-${KGA_REF}.tar.gz" \
            -o "$HOME/rpmbuild/SOURCES/kglobalacceld-${KGA_REF}.tar.gz"
          curl -fsSL --retry 3 \
            "https://invent.kde.org/plasma/kdecoration/-/archive/${KDECO_REF}/kdecoration-${KDECO_REF}.tar.gz" \
            -o "$HOME/rpmbuild/SOURCES/kdecoration-${KDECO_REF}.tar.gz"
          curl -fsSL --retry 3 \
            "https://invent.kde.org/frameworks/kconfig/-/archive/${KCFG_REF}/kconfig-${KCFG_REF}.tar.gz" \
            -o "$HOME/rpmbuild/SOURCES/kconfig-${KCFG_REF}.tar.gz"
          curl -fsSL --retry 3 \
            "https://gitlab.com/theblackdon/noctalia-greeter-kwe/-/archive/${GR_REF}/noctalia-greeter-${GR_REF}.tar.gz" \
            -o "$HOME/rpmbuild/SOURCES/noctalia-greeter-${GR_REF}.tar.gz"
          for T in ~/rpmbuild/SOURCES/*.tar.gz; do
            tar -tzf "$T" > /dev/null
          done

          # kineticwe.desktop.in and start-kineticwe.sh: fetch the canonical
          # scripts/ copies (the ones docs/kineticwe-2.0.md documents as the
          # 2.0 "hard cut" versions), NOT the stale lgl-kineticwe-copr/ copies.
          # The lgl-kineticwe-copr/SOURCES/kineticwe.desktop file still had
          # DesktopNames=KDE, which fights the KineticWE session identity at
          # login (portal backend selection reads DesktopNames). Only
          # kglobalacceld-mask.conf and kineticwe-setup-greeter.sh have no
          # canonical scripts/ counterpart, so those two still come from
          # lgl-kineticwe-copr/.
          curl -fsSL --retry 3 \
            "https://gitlab.com/${{ env.GITLAB_PROJECT }}/-/raw/${SHA}/scripts/kineticwe.desktop.in" \
            -o ~/rpmbuild/SOURCES/kineticwe.desktop.in
          sed 's|@INSTALL_PREFIX@|/usr|g' \
            ~/rpmbuild/SOURCES/kineticwe.desktop.in \
            > ~/rpmbuild/SOURCES/kineticwe.desktop
          rm -f ~/rpmbuild/SOURCES/kineticwe.desktop.in

          # Guard rail: fail the build loudly instead of silently shipping a
          # session that greeters/portals will misidentify as KDE.
          grep -qx 'DesktopNames=KineticWE' ~/rpmbuild/SOURCES/kineticwe.desktop \
            || { echo "kineticwe.desktop has wrong DesktopNames (expected KineticWE)"; exit 1; }

          for P in \
              "lgl-kineticwe-copr/SOURCES/kglobalacceld-mask.conf" \
              "lgl-kineticwe-copr/kineticwe-setup-greeter.sh" \
              "scripts/start-kineticwe.sh"; do
            curl -fsSL --retry 3 \
              "https://gitlab.com/${{ env.GITLAB_PROJECT }}/-/raw/${SHA}/${P}" \
              -o ~/rpmbuild/SOURCES/"$(basename "$P")"
          done
          for F in kineticwe.desktop kglobalacceld-mask.conf kineticwe-setup-greeter.sh start-kineticwe.sh; do
            [[ -s ~/rpmbuild/SOURCES/"$F" ]] || { echo "missing/empty aux file: $F"; exit 1; }
          done
          echo "▶ Pinned refs and auxiliary sources staged in ~/rpmbuild/SOURCES"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "$FILENAME" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(find ~/rpmbuild/SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          [[ -n "$SRPM" ]] || { echo "SRPM was not created"; exit 1; }
          echo "path=$SRPM" >> "$GITHUB_OUTPUT"
          echo "▶ SRPM: $SRPM"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Ensure project chroots (44 / 45 / rawhide)
        if: steps.check.outputs.skip == 'false'
        # copr-cli modify --chroot REPLACES the project's full chroot list
        # each time it's called (it doesn't add to whatever's already
        # enabled), so all target chroots must always be listed together
        # here — that's also why "copr-cli build" below doesn't need its
        # own --chroot flags anymore: it just builds for everything enabled
        # on the project.
        run: |
          copr-cli modify ${{ env.COPR_PROJECT }} \
            $(for c in ${{ env.CHROOTS }}; do echo --chroot "$c"; done)

      - name: Submit to COPR
        if: steps.check.outputs.skip == 'false'
        run: copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }}
name: "onlyoffice - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false

# GITHUB_TOKEN dipakai untuk membaca tag upstream ONLYOFFICE/DesktopEditors
# dengan batas rate yang jauh lebih longgar daripada request anonim.
permissions:
  contents: read

env:
  APP_NAME:       "onlyoffice"
  GITHUB_REPO:    "ONLYOFFICE/DesktopEditors"
  COPR_PROJECT:   "Mindset-Apps"
  RPM_PATTERN:    "onlyoffice-desktopeditors.x86_64.rpm"
  SPEC_FILE:      "specs/onlyoffice.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          # api.github.com membatasi 60 permintaan/jam per IP untuk request tanpa
          # token, dan runner GitHub berbagi IP. Kalau banyak workflow jalan
          # bersamaan, responsnya bisa berupa objek error sehingga .tag_name
          # bernilai null, URL download jadi .../download/vnull/... , dan run
          # gagal dengan "wget exit 8" yang tidak menjelaskan penyebabnya.
          # Pakai GITHUB_TOKEN (limit jauh lebih tinggi) dan fall back ke
          # git ls-remote yang sama sekali tidak memakai REST API.
          REPO="${{ env.GITHUB_REPO }}"
          VER=$(curl -sS \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/latest" \
            | jq -r '.tag_name // empty' | sed 's/^v//' || true)

          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "⚠️ REST API tidak mengembalikan tag, fallback ke git ls-remote"
            VER=$(git ls-remote --tags --refs "https://github.com/${REPO}" \
              | awk -F'refs/tags/' '{print $2}' | sed 's/^v//' \
              | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
          fi

          if [ -z "$VER" ]; then
            echo "❌ Tidak bisa menentukan versi upstream untuk ${REPO}"
            exit 1
          fi

          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("1.17.0-1"); buang
          # suffix-nya agar cocok dengan tag upstream ("1.17.0") saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget
          pip install copr-cli --quiet

      - name: Download official RPM
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          RPM="${{ env.RPM_PATTERN }}"
          URL="https://github.com/${{ env.GITHUB_REPO }}/releases/download/v${VER}/${RPM}"
          echo "▶ Mengunduh: $URL"
          wget -q -O "$RPM" "$URL" || {
            echo "❌ Gagal mengunduh ${URL}"
            exit 1
          }
          # Guard: jangan pernah lanjut dengan halaman error 404 yang tersimpan
          # sebagai .rpm, karena %install akan gagal dengan pesan yang membingungkan.
          rpm -qp "$RPM" > /dev/null || {
            echo "❌ ${RPM} bukan RPM yang valid, kemungkinan halaman error"
            head -c 200 "$RPM"; echo
            exit 1
          }
          echo "▶ Ukuran: $(du -h "$RPM" | cut -f1)"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "${{ env.RPM_PATTERN }}" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          # Status merah tetap dipertahankan (exit $RC) supaya kegagalan build
          # tidak tertutupi, tapi build-id dikumpulkan supaya log chroot bisa
          # diambil di step berikutnya tanpa perlu membuka COPR secara manual.
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal,	log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}
          chroots: "fedora-44-x86_64"

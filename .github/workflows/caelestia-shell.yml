name: "caelestia-shell - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00.00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false
env:
  APP_NAME:       "caelestia-shell"
  GITHUB_REPO:    "caelestia-dots/shell"
  COPR_PROJECT:   "Mindset-Apps"
  TAR_PATTERN:    "caelestia-shell-v{VERSION}.tar.gz"
  SPEC_FILE:      "specs/caelestia-shell.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest")
          VER=$(echo "$RELEASE_JSON" | jq -r '.tag_name' | sed 's/^v//')
          # Rilis selalu punya dua asset: caelestia-shell-latest.tar.gz dan
          # caelestia-shell-v<versi>.tar.gz. Yang dipakai yang versi supaya
          # nama file di SOURCES selalu mengikuti Version spec.
          TAR_EXISTS=$(echo "$RELEASE_JSON" | jq -r --arg pat "caelestia-shell-v${VER}.tar.gz" \
            '[.assets[]? | select(.name == $pat)] | length')
          if [ "$TAR_EXISTS" = "0" ]; then
            echo "⚠ Upstream $VER tidak punya caelestia-shell-v${VER}.tar.gz — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("2.5.0-1"); buang
          # suffix-nya agar cocok dengan tag upstream ("2.5.0") saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          # If upstream check already flagged skip (no tar.gz), honor it
          if [ "${{ steps.upstream.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget
          pip install copr-cli --quiet

      - name: Download sources
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          FILENAME="${{ env.TAR_PATTERN }}"
          FILENAME="${FILENAME/\{VERSION\}/$VER}"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/download/v${VER}/${FILENAME}"

          # Source1 (libcava) dan Source2 (m3shapes) dipin di dalam spec
          # lewat %global — dibaca dari sana supaya workflow dan spec tidak
          # mungkin pakai versi yang berbeda.
          CAVA_VER=$(awk '/^%global cava_version /{print $3}' "${{ env.SPEC_FILE }}")
          M3_REV=$(awk '/^%global m3shapes_rev /{print $3}' "${{ env.SPEC_FILE }}")
          if [ -z "$CAVA_VER" ] || [ -z "$M3_REV" ]; then
            echo "::error::Gagal membaca %global cava_version/m3shapes_rev dari ${{ env.SPEC_FILE }}"
            exit 1
          fi
          wget -q "https://github.com/LukashonakV/cava/archive/refs/tags/${CAVA_VER}.tar.gz" \
            -O "cava-${CAVA_VER}.tar.gz"
          wget -q "https://github.com/soramanew/m3shapes/archive/${M3_REV}.tar.gz" \
            -O "m3shapes-${M3_REV}.tar.gz"
          echo "▶ cava $CAVA_VER, m3shapes ${M3_REV:0:7}"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          SPEC=$(basename "${{ env.SPEC_FILE }}")
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/"$SPEC"
          cp "$FILENAME" cava-*.tar.gz m3shapes-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/"$SPEC"
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        # Daftar chroot dibaca dari .github/copr-chroots.txt, satu sumber
        # kebenaran untuk semua workflow. Menambah chroot baru (mis. Fedora
        # 46/47) cukup edit file itu, tanpa mengubah workflow ini.
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          # Status merah tetap dipertahankan (exit $RC) supaya kegagalan build
          # tidak tertutupi, tapi build-id dikumpulkan supaya log chroot bisa
          # diambil di step berikutnya tanpa perlu membuka COPR secara manual.
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

name: "zapfast - COPR Auto Build"

# Upstream menerbitkan RPM x86_64 sendiri di setiap rilis, jadi workflow ini
# tidak mengompilasi Rust: RPM itu diunduh, payload-nya dibongkar, lalu
# di-repack oleh specs/zapfast.spec. Build COPR jadi selesai dalam hitungan
# detik dan tidak pernah gagal karena perubahan crates.io.

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false

env:
  APP_NAME:       "zapfast"
  GITHUB_REPO:    "crmne/zapfast"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/zapfast.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest")
          TAG=$(jq -r '.tag_name // empty' <<<"$RELEASE_JSON")
          if [ -z "$TAG" ]; then
            echo "⚠ No release found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER="${TAG#v}"
          # Nama aset bisa berubah antar rilis (huruf besar/kecil, akhiran -1,
          # pemisah - atau _), jadi dicari dengan pola, bukan disamakan persis.
          ASSET=$(jq -r '[.assets[]? | select(.name | test("x86_64\\.rpm$"))] | .[0].name // empty' <<<"$RELEASE_JSON")
          if [ -z "$ASSET" ]; then
            echo "⚠ Upstream $VER has no x86_64 RPM — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $TAG ($ASSET)"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          if [ "${{ steps.upstream.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm cpio curl jq
          pip install copr-cli --quiet

      - name: Download & unpack upstream RPM
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.upstream.outputs.tag }}"
          ASSET="${{ steps.upstream.outputs.asset }}"
          curl -fsSL --retry 3 \
            "https://github.com/${{ env.GITHUB_REPO }}/releases/download/${TAG}/${ASSET}" \
            -o upstream.rpm
          mkdir -p pkg
          (cd pkg && rpm2cpio ../upstream.rpm | cpio -idm --quiet)

          # Payload yang diharapkan spec. Kalau upstream memindahkan file,
          # build berhenti di sini dengan pesan jelas, bukan gagal di COPR.
          for f in usr/bin/zapfast \
                   usr/share/applications/zapfast.desktop \
                   usr/share/icons/hicolor/scalable/apps/zapfast.svg \
                   usr/share/zapfast/omarchy/zapfast-theme; do
            [ -e "pkg/$f" ] || { echo "missing payload file: $f"; exit 1; }
          done

          # %license dan %doc butuh berkas di root tarball; upstream menaruhnya
          # di /usr/share/licenses/zapfast/ dan /usr/share/doc/zapfast/.
          LIC=$(find pkg -path '*licenses*' -name 'LICENSE*' -type f | head -1)
          [ -n "$LIC" ] || { echo "no license file in payload"; exit 1; }
          cp "$LIC" pkg/LICENSE
          DOC=$(find pkg -path '*doc*' -name 'README.md' -type f | head -1)
          [ -n "$DOC" ] || { echo "no README.md in payload"; exit 1; }
          cp "$DOC" pkg/README.md

          mv pkg "zapfast-${VER}"
          tar -czf "zapfast-${VER}.tar.gz" "zapfast-${VER}"
          echo "TARBALL=zapfast-${VER}.tar.gz" >> "$GITHUB_ENV"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "$TARBALL" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> "$GITHUB_OUTPUT"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

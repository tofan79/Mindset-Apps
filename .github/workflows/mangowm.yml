name: "mangowm - COPR Auto Build"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mangowm.yml"
      - "specs/mangowm.spec"
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch:

env:
  APP_NAME:       "mangowm"
  GITHUB_REPO:    "mangowm/mango"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/mangowm.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get upstream latest version
        id: upstream
        run: |
          VER=$(curl -s \
            "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "❌ Error: Could not fetch upstream version"
            exit 1
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/package/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '.builds[0].source_package.version // "none"' 2>/dev/null || echo "none")
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget jq
          pip install copr-cli --quiet

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -e
          VER="${{ steps.upstream.outputs.version }}"
          echo "📦 Building SRPM for version: $VER"
          
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          
          # Substitute version in spec file
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/mangowm.spec
          
          # Download mangowm source
          echo "📥 Downloading mangowm source..."
          if ! wget -q "https://github.com/${{ env.GITHUB_REPO }}/archive/refs/tags/v${VER}.tar.gz" -O ~/rpmbuild/SOURCES/mangowm-${VER}.tar.gz; then
            echo "❌ Failed to download mangowm source"
            exit 1
          fi
          
          # Download bundled scenefx source
          echo "📥 Downloading scenefx source..."
          SCENEFX_VER=$(grep "scenefx_version" ~/rpmbuild/SPECS/mangowm.spec | head -1 | sed 's/.*scenefx_version //' | tr -d ' ')
          echo "   SceneFX version: $SCENEFX_VER"
          
          if ! wget -q "https://github.com/wlrfx/scenefx/archive/refs/tags/${SCENEFX_VER}.tar.gz" -O ~/rpmbuild/SOURCES/scenefx-${SCENEFX_VER}.tar.gz; then
            echo "❌ Failed to download scenefx source"
            exit 1
          fi
          
          # Build SRPM
          echo "🔨 Building SRPM..."
          if ! rpmbuild -bs ~/rpmbuild/SPECS/mangowm.spec; then
            echo "❌ rpmbuild failed"
            exit 1
          fi
          
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          if [ -z "$SRPM" ]; then
            echo "❌ No SRPM file found"
            exit 1
          fi
          echo "✅ SRPM built: $SRPM"
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          chmod 600 ~/.config/copr
          
          # Verify credentials
          if ! grep -q "username\|login\|token" ~/.config/copr; then
            echo "❌ Error: COPR credentials not properly configured"
            exit 1
          fi
          echo "✅ COPR credentials configured"

      - name: Verify COPR connectivity
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "🔍 Testing COPR connection..."
          if copr-cli status > /dev/null 2>&1; then
            echo "✅ COPR connection successful"
          else
            echo "⚠️ Warning: Could not verify COPR status, proceeding anyway..."
          fi

      - name: Submit to COPR
        if: steps.check.outputs.skip == 'false'
        run: |
          set -e
          SRPM_PATH="${{ steps.srpm.outputs.path }}"
          echo "📤 Submitting SRPM to COPR: $SRPM_PATH"
          
          if [ ! -f "$SRPM_PATH" ]; then
            echo "❌ Error: SRPM file not found at $SRPM_PATH"
            exit 1
          fi
          
          BUILD_OUTPUT=$(copr-cli build "${{ env.COPR_PROJECT }}" "$SRPM_PATH" 2>&1) || {
            echo "❌ COPR build submission failed:"
            echo "$BUILD_OUTPUT"
            exit 1
          }
          
          echo "✅ Build submitted successfully"
          echo "$BUILD_OUTPUT"
          
          # Extract build ID if available
          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'Build ID: \K[0-9]+' || echo "unknown")
          echo "📋 Build ID: $BUILD_ID"

      - name: Post-build notification
        if: steps.check.outputs.skip == 'false' && always()
        run: |
          if [ $? -eq 0 ]; then
            echo "🎉 COPR build process completed successfully!"
          else
            echo "❌ COPR build process failed!"
          fi

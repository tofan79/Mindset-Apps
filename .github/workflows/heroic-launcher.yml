name: "heroic-launcher - COPR Auto Build"

on:
  schedule:
    - cron: '0 5 * * 6'   # tiap hari Sabtu, jam 05.00 UTC (tiap 7 hari)
  workflow_dispatch:

env:
  APP_NAME:       "heroic-launcher"
  GITHUB_REPO:    "Heroic-Games-Launcher/HeroicGamesLauncher"
  COPR_PROJECT:   "Mindset-Apps"
  RPM_PATTERN:    "Heroic-%{pkg_version}-linux-x86_64.rpm"
  SPEC_FILE:      "specs/heroic-launcher.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get upstream latest version
        id: upstream
        run: |
          VER=$(curl -s \
            "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("1.17.0-1"); buang
          # suffix-nya agar cocok dengan tag upstream ("1.17.0") saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget
          pip install copr-cli --quiet

      - name: Download official RPM
        id: download
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          RPM=$(echo "${{ env.RPM_PATTERN }}" | sed "s/%{pkg_version}/$VER/g")
          wget -q "https://github.com/${{ env.GITHUB_REPO }}/releases/download/v${VER}/${RPM}"
          mv "$RPM" "${{ env.APP_NAME }}-${VER}.rpm"
          echo "rpm_file=${{ env.APP_NAME }}-${VER}.rpm" >> $GITHUB_OUTPUT

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "${{ steps.download.outputs.rpm_file }}" ~/rpmbuild/SOURCES/
          sed -i "s|Source0:.*|Source0: ${{ steps.download.outputs.rpm_file }}|" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Submit to COPR
        if: steps.check.outputs.skip == 'false'
        run: copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }}

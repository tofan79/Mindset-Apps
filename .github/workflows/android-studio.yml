name: "android-studio - COPR Auto Build"

on:
  schedule:
    - cron: '0 23 * * 1'   # tiap Senin, jam 06.00 WIB (23:00 UTC)
  workflow_dispatch:

env:
  APP_NAME:       "android-studio"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/android-studio.spec"
  DL_PAGE:        "https://developer.android.com/studio"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get upstream latest (scrape download page)
        id: upstream
        run: |
          # Ambil URL download Linux langsung dari halaman resmi
          DL_URL=$(curl -s "${{ env.DL_PAGE }}" \
            | grep -oE 'https://edgedl\.me\.gvt1\.com/android/studio/ide-zips/[0-9.]+/android-studio-[a-z0-9-]+-linux\.tar\.gz' \
            | head -1)
          # Fallback: coba domain alternatif
          if [ -z "$DL_URL" ]; then
            DL_URL=$(curl -s "${{ env.DL_PAGE }}" \
              | grep -oE 'https://dl\.google\.com/android/studio/ide-zips/[0-9.]+/android-studio-[a-z0-9-]+-linux\.tar\.gz' \
              | head -1)
          fi
          if [ -z "$DL_URL" ]; then
            echo "❌ Tidak menemukan URL download Android Studio"
            exit 1
          fi
          VER=$(echo "$DL_URL" | sed -E 's|.*/ide-zips/([0-9.]+)/.*|\1|')
          echo "url=$DL_URL" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"
          echo "  URL: $DL_URL"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("1.17.0-1"); buang
          # suffix-nya agar cocok dengan tag upstream ("1.17.0") saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget
          pip install copr-cli --quiet

      - name: Download tar.gz
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          wget -q "${{ steps.upstream.outputs.url }}" -O "android-studio-${VER}-linux.tar.gz"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "android-studio-${VER}-linux.tar.gz" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Submit to COPR
        if: steps.check.outputs.skip == 'false'
        run: copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }}

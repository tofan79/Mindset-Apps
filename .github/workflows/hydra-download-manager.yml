name: "hydra-download-manager - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false

env:
  APP_NAME:       "hydra-download-manager"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/hydra-download-manager.spec"
  UPSTREAM_REPO:  "ja7ad/hydra"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest tag
        id: upstream
        run: |
          set -euo pipefail
          # Hanya tag rilis stabil (x.y.z). Tag seperti v1.2.2-rc memakai
          # tanda hubung, yang ilegal di field Version RPM ("Illegal char
          # '-'"), dan COPR akan menolak SRPM-nya.
          VER=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/tags?per_page=100" \
            | jq -r '.[].name | ltrimstr("v")' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          [ -n "$VER" ] || { echo "no stable tags found"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget jq unzip
          pip install copr-cli --quiet

      - name: Download source tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          curl -sL "https://github.com/${{ env.UPSTREAM_REPO }}/archive/refs/tags/v${VER}.tar.gz" \
            -o ~/hydra-${VER}.tar.gz
          echo "▶ Unduhan: $(du -h ~/hydra-${VER}.tar.gz | cut -f1)"
          echo "▶ Top-level: $(tar -tzf ~/hydra-${VER}.tar.gz | head -1 | cut -d/ -f1)"

      - name: Download official plugins bundle
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          curl -sL "https://github.com/${{ env.UPSTREAM_REPO }}/releases/download/v${VER}/hydra-official-plugins.zip" \
            -o ~/hydra-official-plugins.zip
          echo "▶ Plugins: $(du -h ~/hydra-official-plugins.zip | cut -f1)"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp ~/hydra-${VER}.tar.gz ~/rpmbuild/SOURCES/hydra-${VER}.tar.gz
          cp ~/hydra-official-plugins.zip ~/rpmbuild/SOURCES/hydra-official-plugins.zip
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"

          # copr-cli memantau lewat API yang kadang balas HTML/503 sehingga
          # keluar non-zero padahal build sudah masuk antrean. Kalau build ID
          # sudah ada, jangan percaya RC-nya: cek state akhir langsung dari
          # REST API sampai terminal (maksimal 30 menit).
          ok=false
          STATE=unknown
          if [ -n "$BID" ]; then
            for _ in $(seq 1 120); do
              STATE=$(curl -fsSL --retry 3 \
                "https://copr.fedorainfracloud.org/api_3/build/$BID" \
                | jq -r '.state // "unknown"' 2>/dev/null || echo unknown)
              case "$STATE" in
                succeeded) ok=true; break ;;
                failed|cancelled|skipped) break ;;
              esac
              sleep 15
            done
            echo "▶ COPR build $BID state=$STATE"
          fi

          if [ "$ok" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal (state=$STATE), log chroot akan ditampilkan di bawah"
          fi
          [ "$ok" = "true" ]

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

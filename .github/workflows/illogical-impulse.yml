name: "illogical-impulse - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false
env:
  APP_NAME:     "illogical-impulse"
  GH_PROJECT:   "end-4/dots-hyprland"
  BRANCH:       "main"
  # Submodule di dots/.config/quickshell/ii/modules/common/widgets/shapes.
  # GitHub archive TIDAK membawa isi submodule, jadi di-vendor di step
  # "Download sources" di bawah — isinya wajib ada, kalau kosong widget
  # bulat (MaterialShape) gagal dimuat di runtime.
  SHAPES_REPO:  "end-4/rounded-polygon-qmljs"
  SHAPES_DIR:   "dots/.config/quickshell/ii/modules/common/widgets/shapes"
  COPR_PROJECT: "Mindset-Apps"
  SPEC_FILE:    "specs/illogical-impulse.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest commit (main) + submodule shapes
        id: upstream
        run: |
          set -euo pipefail
          COMMIT=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.GH_PROJECT }}/commits/${{ env.BRANCH }}")
          SHA=$(jq -r '.sha' <<<"$COMMIT")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA from GitHub: $SHA"; exit 1; }
          DATE=$(jq -r '.commit.committer.date' <<<"$COMMIT" | cut -c1-10 | tr -d '-')
          SHORT="${SHA:0:8}"
          VER="${DATE}.git${SHORT}"
          # Ambil commit submodule shapes pada tree commit ini; entri submodule
          # mengembalikan field .sha (commit yang di-pin), bukan isi berkas.
          SUB=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.GH_PROJECT }}/contents/${{ env.SHAPES_DIR }}?ref=$SHA")
          SUB_SHA=$(jq -r '.sha' <<<"$SUB")
          [[ "$SUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid submodule SHA: $SUB_SHA"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sub_sha=$SUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $VER ($SHORT), shapes $SUB_SHA"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("2026.10.11.gitXXXXXXXX-1");
          # buang suffix-nya agar cocok dengan commit upstream saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget curl jq
          pip install copr-cli --quiet

      - name: Download sources + vendor submodule
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          SHA="${{ steps.upstream.outputs.sha }}"
          SUB_SHA="${{ steps.upstream.outputs.sub_sha }}"
          FILENAME="${{ env.APP_NAME }}-${VER}.tar.gz"

          curl -fsSL --retry 3 \
            "https://github.com/${{ env.GH_PROJECT }}/archive/${SHA}.tar.gz" \
            -o base.tar.gz
          curl -fsSL --retry 3 \
            "https://github.com/${{ env.SHAPES_REPO }}/archive/${SUB_SHA}.tar.gz" \
            -o shapes.tar.gz

          # GitHub commit archives have a "<repo>-<sha>" top dir; rename
          # so %autosetup -n %{name}-%{version} matches.
          mkdir -p extract
          tar -xzf base.tar.gz -C extract
          mapfile -t TOP < <(find extract -mindepth 1 -maxdepth 1 -type d)
          [ "${#TOP[@]}" -eq 1 ] || { echo "expected 1 top dir, got ${#TOP[@]}"; exit 1; }
          mv "${TOP[0]}" "${{ env.APP_NAME }}-${VER}"

          # Vendor isi submodule shapes ke posisinya (git archive kosong di situ).
          mkdir -p shapes-extract
          tar -xzf shapes.tar.gz -C shapes-extract
          mapfile -t STOP < <(find shapes-extract -mindepth 1 -maxdepth 1 -type d)
          [ "${#STOP[@]}" -eq 1 ] || { echo "expected 1 shapes top dir, got ${#STOP[@]}"; exit 1; }
          SHAPES_DEST="${{ env.APP_NAME }}-${VER}/${{ env.SHAPES_DIR }}"
          mkdir -p "$SHAPES_DEST"
          cp -a "${STOP[0]}/." "$SHAPES_DEST/"
          [ -n "$(find "$SHAPES_DEST" -type f -print -quit)" ] || { echo "shapes kosong setelah vendor"; exit 1; }
          # .gitmodules dibuang: di dalam tarball sudah tidak ada git sama sekali.
          rm -f "${{ env.APP_NAME }}-${VER}/.gitmodules"

          tar -czf "$FILENAME" "${{ env.APP_NAME }}-${VER}"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          echo "▶ Downloaded $FILENAME ($SHA + shapes $SUB_SHA)"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "$FILENAME" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(find ~/rpmbuild/SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          [[ -n "$SRPM" ]] || { echo "SRPM was not created"; exit 1; }
          echo "path=$SRPM" >> "$GITHUB_OUTPUT"
          echo "▶ SRPM: $SRPM"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          # Status merah tetap dipertahankan (exit $RC) supaya kegagalan build
          # tidak tertutupi, tapi build-id dikumpulkan supaya log chroot bisa
          # diambil di step berikutnya tanpa perlu membuka COPR secara manual.
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

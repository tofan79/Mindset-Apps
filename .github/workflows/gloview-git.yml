name: "gloview-git - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:

env:
  APP_NAME:     "gloview-git"
  GH_PROJECT:   "fedsfarm/gloview"
  BRANCH:       "main"
  COPR_PROJECT: "Mindset-Apps"
  SPEC_FILE:    "specs/gloview-git.spec"
  CHROOT:       "fedora-44-x86_64"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest commit (main)
        id: upstream
        run: |
          set -euo pipefail
          COMMIT=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.GH_PROJECT }}/commits/${{ env.BRANCH }}")
          SHA=$(jq -r '.sha' <<<"$COMMIT")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA from GitHub: $SHA"; exit 1; }
          DATE=$(jq -r '.commit.committer.date' <<<"$COMMIT" | cut -c1-10 | tr -d '-')
          SHORT="${SHA:0:8}"
          VER="${DATE}.git${SHORT}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $VER ($SHORT)"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("2026.09.24.gitXXXXXXXX-1");
          # buang suffix-nya agar cocok dengan commit upstream saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget curl jq
          pip install copr-cli --quiet

      - name: Download source tarball (from GitHub commit SHA)
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          SHA="${{ steps.upstream.outputs.sha }}"
          FILENAME="${{ env.APP_NAME }}-${VER}.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/${{ env.GH_PROJECT }}/archive/${SHA}.tar.gz" \
            -o "$FILENAME"
          # GitHub commit archives have a "<repo>-<short-sha>" top dir; rename
          # so %autosetup -n %{name}-%{version} matches.
          mkdir -p extract
          tar -xzf "$FILENAME" -C extract
          mapfile -t TOP < <(find extract -mindepth 1 -maxdepth 1 -type d)
          [ "${#TOP[@]}" -eq 1 ] || { echo "expected 1 top dir, got ${#TOP[@]}"; exit 1; }
          mv "${TOP[0]}" "${{ env.APP_NAME }}-${VER}"
          tar -czf "$FILENAME" "${{ env.APP_NAME }}-${VER}"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          echo "▶ Downloaded $FILENAME ($SHA)"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "$FILENAME" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(find ~/rpmbuild/SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          [[ -n "$SRPM" ]] || { echo "SRPM was not created"; exit 1; }
          echo "path=$SRPM" >> "$GITHUB_OUTPUT"
          echo "▶ SRPM: $SRPM"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Enable external Hyprland repo (lionheartp/Hyprland)
        if: steps.check.outputs.skip == 'false'
        # gloview links against pkgconfig(hyprland), and Hyprland isn't in
        # Fedora's own repos. lionheartp/Hyprland is a fork of
        # solopasha/hyprland that also tracks git HEAD (package
        # hyprland-git), matching this package's own daily-rolling scheme —
        # without this, "BuildRequires: pkgconfig(hyprland)" fails before
        # the build even starts. --repo sets the project's full external
        # repo list, so if this COPR project ever needs *other* external
        # repos too, add them here as well (space-separated) rather than
        # via the web UI, or this step will overwrite them on the next run.
        run: copr-cli modify ${{ env.COPR_PROJECT }} --repo "copr://lionheartp/Hyprland"

      - name: Submit to COPR
        if: steps.check.outputs.skip == 'false'
        run: copr-cli build --chroot ${{ env.CHROOT }} ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }}

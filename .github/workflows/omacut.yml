name: "omacut - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false

env:
  APP_NAME:       "omacut"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/omacut.spec"
  UPSTREAM_REPO:  "omacom/omacut"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest tag
        id: upstream
        run: |
          VER=$(curl -s "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/tags" \
            | jq -r '.[0].name | ltrimstr("v")')
          [ -z "$VER" ] && VER="0.0.0"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("0.4.0-1"); buang
          # suffix-nya agar cocok dengan tag upstream ("0.4.0") saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          # Suffix release sengaja dibuang saat perbandingan di atas, jadi
          # menaikkan Release di spec tidak akan memicu build. Pakai input
          # "force" untuk membangun ulang versi yang sama.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget jq
          pip install copr-cli --quiet

      # Pakai endpoint archive/refs/tags (bukan /tarball/): yang ini menghasilkan
      # direktori top-level omacut-<versi>, sesuai dengan %autosetup di spec.
      # Endpoint /tarball/ menamai foldernya omacom-omacut-<sha> dan akan
      # menggagalkan %prep.
      - name: Download source tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          curl -sL "https://github.com/${{ env.UPSTREAM_REPO }}/archive/refs/tags/v${VER}.tar.gz" \
            -o ~/omacut-${VER}.tar.gz
          echo "▶ Unduhan: $(du -h ~/omacut-${VER}.tar.gz | cut -f1)"
          echo "▶ Top-level: $(tar -tzf ~/omacut-${VER}.tar.gz | head -1 | cut -d/ -f1)"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp ~/omacut-${VER}.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          # Status merah tetap dipertahankan (exit $RC) supaya kegagalan build
          # tidak tertutupi, tapi build-id dikumpulkan supaya log chroot bisa
          # diambil di step berikutnya tanpa perlu membuka COPR secara manual.
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal,	log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}
          chroots: "fedora-44-x86_64"

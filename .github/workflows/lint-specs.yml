name: "Lint spec"

# Wajib jalan sebelum push: workflow lain tidak punya trigger "push" (build
# COPR sengaja hanya schedule/dispatch), jadi validasi spec harus punya sendiri.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    # Container Fedora supaya dnf benar-benar tersedia. Repo build COPR
    # (podman/buildah + chroot fedora) tidak bisa dipakai di runner GitHub,
    # jadi dnf di dalam container Fedora adalah cek terdekat yang bisa
    # dilakukan tanpa mengorbankan repo.
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        run: |
          dnf install -y rpm-build dnf-plugins-core python3-jinja2 \
            >/dev/null
          rpm --version

      - name: Parse semua spec
        id: parse
        run: |
          set -u
          fail=0
          : > /tmp/br.txt
          for f in specs/*.spec; do
            # rpmspec dijalankan SEKALI: stdout = spec hasil parse,
            # stderr = diagnostik. Dipisah supaya pesan error rpmspec
            # tidak ikut ter-"isi spec" dan jadi dependency palsu.
            if rpmspec -P --define "pkg_version 1.0" "$f" >/tmp/parsed.txt 2>/tmp/err.txt; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"
              echo "::error file=$f::rpmspec gagal: $(head -1 /tmp/err.txt)"
              fail=1
              continue
            fi
            # Ambil BuildRequires saja. Requires runtime di-skip: paket kita
            # memang boleh menarik dependensi yang belum ada di chroot.
            #
            # Urutan itu penting: filter baris BuildRequires dulu, baru
            # buang prefix-nya, baru tokenisasi. Kalau dibalik, sed tidak
            # akan pernah cocok karena baris sudah pecah jadi token.
            #
            # Parser awk di bawah wajib melewati operator versi DAN token
            # sesudahnya — kalau tidak, "cmake >= 3.21" akan menyisakan "3.21"
            # sebagai dependency palsu.
            #
            # pkgconfig(...) di-skip karena itu dependency auto-generated yang
            # rpm buat sendiri dan selalu ikut ter-resolve bersama -devel
            # pemilik .pc-nya. Polanya harus menerima kurung pembuka juga:
            # gloview-git.spec menulis
            #   (pkgconfig(lua) or pkgconfig(lua5.4) or pkgconfig(luajit))
            # jadi token pertamanya adalah "(pkgconfig(lua)". Kalau hanya
            # dicek dengan /^pkgconfig\(/, token itu lolos, lalu gsub
            # menghapus semua kurung dan menyisakan dependency palsu
            # bernama "pkgconfiglua".
            grep -E '^BuildRequires:' /tmp/parsed.txt \
              | sed -E 's/^BuildRequires:[[:space:]]*//' \
              | awk '{
                  skip = 0
                  for (i = 1; i <= NF; i++) {
                    t = $i
                    if (skip) { skip = 0; continue }
                    if (t ~ /^(>=|<=|==|!=|>|<)$/) { skip = 1; continue }
                    if (t ~ /^\(?pkgconfig\(/) { continue }
                    gsub(/[()]/, "", t)
                    if (t == "" || t ~ /^(or|and)$/) continue
                    print t
                  }
                }' >> /tmp/br.txt
          done
          sort -u -o /tmp/br.txt /tmp/br.txt
          echo "---"
          echo "BuildRequires unik: $(wc -l < /tmp/br.txt)"
          exit $fail

      - name: Resolvability semua BuildRequires
        # Ini inti pemeriksaan. dnf install --assumeno benar-benar
        # menyelesaikan dependensi, sehingga ikut menangkap virtual provide
        # (mis. "libEGL-devel" -> mesa-libEGL-devel, "pkgconfig" ->
        # pkgconf-pkg-config). Hanya mencocokkan NAMA paket akan menghasilkan
        # false positive di dua kasus itu.
        run: |
          set -uo pipefail
          fail=0
          missing=0
          while read -r dep; do
            # Buang sisa tanda kurung/nol dari parsing.
            dep="${dep%%)*}"
            dep="${dep%%(*}"
            [ -n "$dep" ] || continue
            if out=$(dnf install --assumeno --setopt=install_weak_deps=False \
                     -q "$dep" 2>&1); then
              :
            elif echo "$out" | grep -qiE 'no match for argument|nothing provides'; then
              echo "::error::BuildRequires tidak bisa diresolve: $dep"
              missing=$((missing + 1))
              fail=1
            else
              # Error lain (mis. sudo, lock) bukan berarti paket hilang.
              echo "  ? $dep (tidak bisa dipastikan, diabaikan)"
            fi
          done < /tmp/br.txt
          echo "---"
          if [ "$missing" -eq 0 ]; then
            echo "OK: semua BuildRequires resolvable di F44"
          else
            echo "$missing BuildRequires tidak ditemukan"
          fi
          exit $fail

      - name: SRPM bisa dibangun?
        # rpmbuild -bs mewajibkan semua SourceN/PatchN ada di _sourcedir.
        # Dulu _sourcedir diarahkan ke /dev/null sehingga SEMUA spec gagal
        # dengan "Bad file: /dev/null/xxx: Not a directory". Sekarang tiap
        # spec dapat direktori sementara berisi file kosong bernama sama
        # dengan Source/Patch hasil ekspansi macro (rpmspec -P): yang dicek
        # cuma struktur spec, bukan isi tarball.
        run: |
          set -uo pipefail
          fail=0
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          for f in specs/*.spec; do
            n=$(basename "$f" .spec)
            cp "$f" ~/rpmbuild/SPECS/
            sed -i 's/%{pkg_version}/1.0/g' ~/rpmbuild/SPECS/"$n".spec
            src=$(mktemp -d)
            rpmspec -P ~/rpmbuild/SPECS/"$n".spec 2>/dev/null \
              | awk '/^(Source|Patch)[0-9]*:/ {print $2}' \
              | while read -r s; do
                  case "$s" in *'#/'*) s="${s##*#/}" ;; esac
                  touch "$src/$(basename "$s")"
                done
            if rpmbuild -bs --define "_sourcedir $src" \
                 ~/rpmbuild/SPECS/"$n".spec >/tmp/lint.log 2>&1; then
              echo "  ✓ $n"
            else
              echo "::error file=$f::rpmbuild -bs gagal: $(grep -i error /tmp/lint.log | head -1)"
              fail=1
            fi
            rm -rf "$src" ~/rpmbuild/SPECS/"$n".spec
          done
          exit $fail

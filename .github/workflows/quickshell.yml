name: "quickshell - COPR Build"

on:
  schedule:
    - cron: '0 6 */7 * *'   # tiap 7 hari (mingguan), jam 06.00 UTC
  push:
    branches:
      - main
    paths:
      - ".github/workflows/quickshell.yml"
      - "specs/quickshell.spec"
  workflow_dispatch:

env:
  APP_NAME:       "quickshell"
  COPR_PROJECT:   "Mindset-Apps"
  GIT_REPO:       "quickshell-mirror/quickshell"
  GIT_COMMIT:     "4b4fca3224ab977dc515ac0bb78d00b3dfa71e00"
  SPEC_FILE:      "specs/quickshell.spec"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget git
          pip install copr-cli --quiet

      - name: Download quickshell source
        run: |
          wget -q "https://github.com/${{ env.GIT_REPO }}/archive/${{ env.GIT_COMMIT }}/quickshell-${{ env.GIT_COMMIT }}.tar.gz"
          ls -la "quickshell-${{ env.GIT_COMMIT }}.tar.gz"

      - name: Build SRPM
        id: srpm
        run: |
          VER="0.3.0"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          # Copy and prepare spec
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          cp "quickshell-${{ env.GIT_COMMIT }}.tar.gz" ~/rpmbuild/SOURCES/
          # Build SRPM
          rpmbuild -bs ~/rpmbuild/SPECS/quickshell.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT
          echo "✅ SRPM: $SRPM"

      - name: Setup COPR credentials
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Reset additional repos
        run: copr-cli modify --repo "" ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        run: copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }}

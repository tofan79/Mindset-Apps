name: "sysc-greet - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00.00 UTC)
  push:
    # Push yang menyentuh spec langsung memicu build, jadi perubahan spec
    # (mis. ganti kitty -> ghostty) bisa dicoba tanpa menunggu jadwal.
    # File workflow sendiri TIDAK termasuk: memperbaiki workflow tidak perlu
    # membangun ulang paket yang sama.
    paths:
      - 'specs/sysc-greet.spec'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false

env:
  APP_NAME:       "sysc-greet"
  GITHUB_REPO:    "Nomadcxx/sysc-greet"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/sysc-greet.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest")
          VER=$(echo "$RELEASE_JSON" | jq -r '.tag_name' | sed 's/^v//')
          # Release upstream tidak menyertakan asset source (hanya paket deb).
          # Source diambil dari arsip git tag; tag memakai prefix "v" (v1.1.11).
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "⚠ Gagal membaca tag upstream — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("1.1.11-1"); buang
          # suffix-nya agar cocok dengan tag upstream ("1.1.11").
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "🔨 Build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm wget
          pip install copr-cli --quiet

      - name: Download source tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          echo "FILENAME=sysc-greet-${VER}.tar.gz" >> $GITHUB_ENV
          # Arsip git tag berisi aset media besar (assets/ 32 MB, docs-site/
          # 1.3 MB) yang tidak dipakai binary (tidak ada go:embed ke sana).
          # Dibuang sebelum di-repack supaya SRPM tetap ringan; top-level
          # direktori sysc-greet-<ver>/ dipertahankan supaya %setup cocok.
          curl -fsSL "https://github.com/${{ env.GITHUB_REPO }}/archive/refs/tags/v${VER}.tar.gz" \
            -o /tmp/src.tar.gz
          tar xzf /tmp/src.tar.gz -C /tmp
          rm -rf "/tmp/sysc-greet-${VER}/assets" "/tmp/sysc-greet-${VER}/docs-site"
          tar czf "sysc-greet-${VER}.tar.gz" -C /tmp "sysc-greet-${VER}"
          ls -lh "sysc-greet-${VER}.tar.gz"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          SPEC=$(basename "${{ env.SPEC_FILE }}")
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/"$SPEC"
          cp "$FILENAME" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/"$SPEC"
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          # COPR kadang membalas halaman 503 saat pemantauan, sehingga copr-cli
          # keluar non-zero padahal build sudah masuk antrean (terlihat dari
          # "Created builds: <id>"). Itu gangguan sisi COPR, bukan kegagalan
          # build — jangan gagalkan run; hasil akhirnya dicek di web COPR.
          if [ "$RC" -ne 0 ] && [ -n "$BID" ] && printf '%s' "$OUT" | grep -q 'not in JSON format'; then
            echo "::warning::COPR API sedang gangguan (503); build $BID tetap terkirim, status dicek manual."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

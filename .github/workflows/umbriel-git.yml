name: "umbriel-git - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false
  push:
    paths:
      - 'specs/umbriel-git.spec'

env:
  APP_NAME:     "umbriel-git"
  GH_PROJECT:   "noctalia-dev/umbriel"
  BRANCH:       "main"
  COPR_PROJECT: "Mindset-Apps"
  SPEC_FILE:    "specs/umbriel-git.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest commit (main)
        id: upstream
        run: |
          set -euo pipefail
          COMMIT=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.GH_PROJECT }}/commits/${{ env.BRANCH }}")
          SHA=$(jq -r '.sha' <<<"$COMMIT")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA from GitHub: $SHA"; exit 1; }
          DATE=$(jq -r '.commit.committer.date' <<<"$COMMIT" | cut -c1-10 | tr -d '-')
          SHORT="${SHA:0:8}"
          BASE=$(curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${{ env.GH_PROJECT }}/${SHA}/VERSION" \
            | tr -d '[:space:]')
          [[ -n "$BASE" ]] || { echo "VERSION not found in upstream"; exit 1; }
          VER="${BASE}.${DATE}.git${SHORT}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $VER ($SHORT)"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "🔨 Build diminta (versi $UP)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget curl jq
          pip install copr-cli --quiet

      - name: Download source tarball (from GitHub commit SHA)
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          SHA="${{ steps.upstream.outputs.sha }}"
          FILENAME="${{ env.APP_NAME }}-${VER}.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/${{ env.GH_PROJECT }}/archive/${SHA}.tar.gz" \
            -o upstream.tar.gz
          mkdir -p extract
          tar -xzf upstream.tar.gz -C extract
          mapfile -t TOP < <(find extract -mindepth 1 -maxdepth 1 -type d)
          [ "${#TOP[@]}" -eq 1 ] || { echo "expected 1 top dir, got ${#TOP[@]}"; exit 1; }
          mv "${TOP[0]}" "${{ env.APP_NAME }}-${VER}"
          tar -czf "$FILENAME" "${{ env.APP_NAME }}-${VER}"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "▶ Downloaded $FILENAME ($SHA)"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/umbriel-git.spec
          cp "$FILENAME" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/umbriel-git.spec
          SRPM=$(find ~/rpmbuild/SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          [[ -n "$SRPM" ]] || { echo "SRPM was not created"; exit 1; }
          echo "path=$SRPM" >> $GITHUB_OUTPUT
          echo "▶ SRPM: $SRPM"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}
name: "TEMP delete heroic-launcher from COPR"

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install copr-cli
        run: |
          pip install copr-cli --quiet

      - name: Setup COPR credentials
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Delete package
        run: copr-cli delete-package --name heroic-launcher Mindset-Apps

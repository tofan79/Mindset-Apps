name: "omaview - COPR Auto Build"

# Omaview (Omarchy's picture viewer and media player). Sumber diambil langsung
# dari tarball tag rilis GitHub, jadi workflow hanya mengunduh tarball, membuat
# SRPM, lalu mengirimnya ke COPR. Nama paket dan path install mengikuti hulu:
# /usr/bin/omaview, omaview.desktop, dan ikon omaview.svg.

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false

env:
  APP_NAME:       "omaview"
  UPSTREAM_REPO:  "omacom/omaview"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/omaview.spec"
  UPSTREAM_NAME:  "omaview"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -sS --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" || true)
          VER=$(printf '%s' "$RELEASE_JSON" \
            | jq -r '.tag_name // empty' 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$VER" ]; then
            VER=$(git ls-remote --tags --refs "https://github.com/${{ env.UPSTREAM_REPO }}.git" \
              | awk -F/ '{print $NF}' \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' | sort -V | tail -1)
          fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "invalid upstream version: $VER"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          REL=$(awk '/^Release:/{print $2; exit}' "${{ env.SPEC_FILE }}" | cut -d% -f1)
          UP_FULL="$UP-$REL"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP_FULL)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$UP_FULL" = "$CP" ]; then
            echo "✅ Up-to-date ($UP_FULL), skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Update $CP → $UP_FULL"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget curl jq git
          pip install copr-cli --quiet

      - name: Download release tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          NAME="${{ env.UPSTREAM_NAME }}"
          curl -fsSL --retry 3 \
            "https://github.com/${{ env.UPSTREAM_REPO }}/archive/refs/tags/v${VER}.tar.gz" \
            -o "$HOME/${NAME}-${VER}.tar.gz"
          echo "▶ Unduhan: $(du -h "$HOME/${NAME}-${VER}.tar.gz" | cut -f1)"
          TOP=$(tar -tzf "$HOME/${NAME}-${VER}.tar.gz" | sed -n '1p' | cut -d/ -f1)
          echo "▶ Top-level: $TOP"
          [ "$TOP" = "${NAME}-${VER}" ] \
            || { echo "top-level tarball tak terduga: $TOP"; exit 1; }

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          NAME="${{ env.UPSTREAM_NAME }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          SPEC_BASENAME=$(basename "${{ env.SPEC_FILE }}")
          cp "${{ env.SPEC_FILE }}" ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/"$SPEC_BASENAME"
          cp "$HOME/${NAME}-${VER}.tar.gz" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/"$SPEC_BASENAME"
          SRPM=$(find ~/rpmbuild/SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          [[ -n "$SRPM" ]] || { echo "SRPM was not created"; exit 1; }
          echo "path=$SRPM" >> "$GITHUB_OUTPUT"
          echo "▶ SRPM: $SRPM"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"

          # copr-cli memantau lewat API yang kadang balas HTML/503 sehingga
          # keluar non-zero padahal build sudah masuk antrean. Kalau build ID
          # sudah ada, jangan percaya RC-nya: cek state akhir langsung dari
          # REST API sampai terminal (maksimal 30 menit).
          ok=false
          STATE=unknown
          if [ -n "$BID" ]; then
            for _ in $(seq 1 120); do
              STATE=$(curl -fsSL --retry 3 \
                "https://copr.fedorainfracloud.org/api_3/build/$BID" \
                | jq -r '.state // "unknown"' 2>/dev/null || echo unknown)
              case "$STATE" in
                succeeded) ok=true; break ;;
                failed|cancelled|skipped) break ;;
              esac
              sleep 15
            done
            echo "▶ COPR build $BID state=$STATE"
          fi

          if [ "$ok" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal (state=$STATE), log chroot akan ditampilkan di bawah"
          fi
          [ "$ok" = "true" ]

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

name: "material-symbols-fonts - COPR Auto Build"

# Upstream repositorynya tidak pernah merilis tarball: satu-satunya artefak
# adalah file .ttf di dalam repo, yang diperbarui lewat commit ke master.
# Karena itu versinya diambil dari name-table font-nya sendiri ("Version
# 2.973"), bukan dari tag atau commit — angkanya baru berubah saat Google
# benar-benar meregenerasi font, jadi Smart Skip-nya tidak ikut berisik setiap
# ada commit ikon baru.

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00.00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false
env:
  APP_NAME:       "material-symbols-fonts"
  GH_REPO:        "google/material-design-icons"
  FONT_URL_PATH:  "variablefont/MaterialSymbolsRounded%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/material-symbols-fonts.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream font version
        id: upstream
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL --retry 3 "https://api.github.com/repos/${{ env.GH_REPO }}/commits/master" | jq -r '.sha')
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA from GitHub: $SHA"; exit 1; }
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${{ env.GH_REPO }}/${SHA}/${{ env.FONT_URL_PATH }}" \
            -o font.ttf
          pip install fonttools --quiet
          VER=$(python3 -c "from fontTools.ttLib import TTFont; print(TTFont('font.ttf')['name'].getDebugName(5).removeprefix('Version ').strip())")
          [[ "$VER" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "unexpected font version: $VER"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: font version $VER (${SHA:0:8})"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("2.973-1"); buang
          # suffix-nya agar cocok dengan versi name-table font saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget curl jq
          pip install copr-cli fonttools --quiet

      - name: Stage sources
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          SHA="${{ steps.upstream.outputs.sha }}"
          mkdir -p ~/rpmbuild/SOURCES
          # Font sudah diunduh di step versi; nama file di SOURCES sengaja
          # dibuat tanpa tanda kurung/koma supaya tidak menyulitkan shell dan
          # glob di spec.
          cp font.ttf ~/rpmbuild/SOURCES/MaterialSymbolsRounded-VF.ttf
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${{ env.GH_REPO }}/${SHA}/LICENSE" \
            -o ~/rpmbuild/SOURCES/LICENSE
          grep -qi "Apache License" ~/rpmbuild/SOURCES/LICENSE \
            || { echo "LICENSE upstream bukan Apache-2.0 seperti yang diharapkan"; exit 1; }
          # Guard rail: pastikan keluarga font yang di-hardcode Caelestia
          # memang ada di file ini, bukan tertukar dengan gaya lain.
          python3 -c "
          from fontTools.ttLib import TTFont
          names = {TTFont('font.ttf')['name'].getDebugName(i) for i in (1, 16)}
          assert 'Material Symbols Rounded' in names, names
          print('▶ Keluarga font:', names)
          "
          echo "▶ Sumber siap di ~/rpmbuild/SOURCES"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(find ~/rpmbuild/SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          [[ -n "$SRPM" ]] || { echo "SRPM tidak terbentuk"; exit 1; }
          echo "path=$SRPM" >> "$GITHUB_OUTPUT"
          echo "▶ SRPM: $SRPM"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        # Daftar chroot dibaca dari .github/copr-chroots.txt, satu sumber
        # kebenaran untuk semua workflow. Menambah chroot baru (mis. Fedora
        # 46/47) cukup edit file itu, tanpa mengubah workflow ini.
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          # Status merah tetap dipertahankan (exit $RC) supaya kegagalan build
          # tidak tertutupi, tapi build-id dikumpulkan supaya log chroot bisa
          # diambil di step berikutnya tanpa perlu membuka COPR secara manual.
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

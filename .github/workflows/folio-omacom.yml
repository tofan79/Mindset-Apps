name: "folio-omacom - COPR Auto Build"

# Folio (Omarchy's file manager). Paket mengikuti tag release upstream apa
# adanya: Source0 di spec menunjuk langsung ke tarball release GitHub
# (archive/refs/tags/v<ver>.tar.gz), jadi workflow ini tidak perlu clone repo
# atau membungkus ulang sumber seperti hyprfm -- cukup unduh tarball, bikin
# SRPM, lalu kirim ke COPR.
#
# Nama paket "folio-omacom" dipakai karena Fedora sudah punya paket `folio`
# (aplikasi catatan GNOME). Biner dan path data tetap milik upstream
# (/usr/bin/folio, /usr/share/folio/plugins).

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false

env:
  APP_NAME:       "folio-omacom"
  UPSTREAM_REPO:  "omacom/folio"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/folio-omacom.spec"
  # Nama direktori/tarball di dalam arsip upstream tetap "folio-<ver>",
  # bukan nama paket kita; spec menanganinya lewat %autosetup -n folio-%{version}.
  UPSTREAM_NAME:  "folio"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -sS --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest" || true)
          VER=$(printf '%s' "$RELEASE_JSON" \
            | jq -r '.tag_name // empty' 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$VER" ]; then
            # Belum ada release (mis. repo baru pakai tag): ambil tag numerik
            # tertinggi, sama seperti hyprfm.
            VER=$(git ls-remote --tags --refs "https://github.com/${{ env.UPSTREAM_REPO }}.git" \
              | awk -F/ '{print $NF}' \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' | sort -V | tail -1)
          fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "invalid upstream version: $VER"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          set -euo pipefail
          CURRENT=$(curl -fsSL --retry 3 \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget curl jq git
          pip install copr-cli --quiet

      - name: Download release tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          NAME="${{ env.UPSTREAM_NAME }}"
          # Nama file harus sama persis dengan basename Source0 di spec,
          # kalau tidak rpmbuild -bs akan bilang "Bad file".
          curl -fsSL --retry 3 \
            "https://github.com/${{ env.UPSTREAM_REPO }}/archive/refs/tags/v${VER}.tar.gz" \
            -o "$HOME/${NAME}-${VER}.tar.gz"
          echo "▶ Unduhan: $(du -h "$HOME/${NAME}-${VER}.tar.gz" | cut -f1)"
          # sed, bukan `| head -1`: dengan `set -o pipefail`, head yang menutup
          # pipe lebih awal membuat tar keluar dengan 141 dan step dianggap gagal.
          TOP=$(tar -tzf "$HOME/${NAME}-${VER}.tar.gz" | sed -n '1p' | cut -d/ -f1)
          echo "▶ Top-level: $TOP"
          [ "$TOP" = "${NAME}-${VER}" ] \
            || { echo "top-level tarball tak terduga: $TOP"; exit 1; }

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          NAME="${{ env.UPSTREAM_NAME }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          SPEC_BASENAME=$(basename "${{ env.SPEC_FILE }}")
          cp "${{ env.SPEC_FILE }}" ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/"$SPEC_BASENAME"
          cp "$HOME/${NAME}-${VER}.tar.gz" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/"$SPEC_BASENAME"
          SRPM=$(find ~/rpmbuild/SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          [[ -n "$SRPM" ]] || { echo "SRPM was not created"; exit 1; }
          echo "path=$SRPM" >> "$GITHUB_OUTPUT"
          echo "▶ SRPM: $SRPM"

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

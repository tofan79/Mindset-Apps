name: "inir-shell - COPR Auto Build"

# Pola sama dengan caelestia-shell.yml, bedanya iNiR tidak punya asset
# tarball di GitHub Release: rilis cuma menandai tag, jadi Source0 diambil
# dari arsip tag (archive/refs/tags/v<versi>.tar.gz). Nama arsip diubah
# menjadi inir-shell-<versi>.tar.gz supaya cocok dengan Source0 spec.
on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00.00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false
env:
  APP_NAME:       "inir-shell"
  GITHUB_REPO:    "snowarch/iNiR"
  COPR_PROJECT:   "Mindset-Apps"
  TAR_PATTERN:    "inir-shell-{VERSION}.tar.gz"
  SPEC_FILE:      "specs/inir-shell.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          RELEASE_JSON=$(curl -s "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest")
          VER=$(echo "$RELEASE_JSON" | jq -r '.tag_name' | sed 's/^v//')
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "::error::Tidak bisa membaca tag rilis terbaru dari ${{ env.GITHUB_REPO }}"
            exit 1
          fi
          # Rilis iNiR tidak membawa asset; pastikan arsip tag memang ada.
          if ! curl -sfIL -o /dev/null \
              "https://github.com/${{ env.GITHUB_REPO }}/archive/refs/tags/v${VER}.tar.gz"; then
            echo "⚠ Tag v${VER} tidak punya arsip — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          # COPR mengembalikan versi dengan suffix release ("2.33.0-1"); buang
          # suffix-nya agar cocok dengan tag upstream ("2.33.0") saat dibandingkan.
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          # If upstream check already flagged skip (no archive), honor it
          if [ "${{ steps.upstream.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget
          pip install copr-cli --quiet

      - name: Download sources
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          FILENAME="${{ env.TAR_PATTERN }}"
          FILENAME="${FILENAME/\{VERSION\}/$VER}"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          curl -sfL "https://github.com/${{ env.GITHUB_REPO }}/archive/refs/tags/v${VER}.tar.gz" \
            -o "$FILENAME"
          # %autosetup memakai -n iNiR-<versi>; buktikan top-level dir arsip
          # memang bernama itu supaya %prep tidak meleset.
          TOPDIR=$(tar tzf "$FILENAME" | head -1 | cut -d/ -f1)
          if [ "$TOPDIR" != "iNiR-${VER}" ]; then
            echo "::error::Top-level arsip '$TOPDIR' != 'iNiR-${VER}' (cek %autosetup di spec)"
            exit 1
          fi
          echo "▶ arsip ok: $TOPDIR"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          SPEC=$(basename "${{ env.SPEC_FILE }}")
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/"$SPEC"
          cp "$FILENAME" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/"$SPEC"
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        # Daftar chroot dibaca dari .github/copr-chroots.txt, satu sumber
        # kebenaran untuk semua workflow. Menambah chroot baru (mis. Fedora
        # 46/47) cukup edit file itu, tanpa mengubah workflow ini.
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          # Status merah tetap dipertahankan (exit $RC) supaya kegagalan build
          # tidak tertutupi, tapi build-id dikumpulkan supaya log chroot bisa
          # diambil di step berikutnya tanpa perlu membuka COPR secara manual.
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

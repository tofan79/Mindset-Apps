name: "intellij-idea - COPR Auto Build"

on:
  schedule:
    - cron: '0 3 * * 1'   # tiap hari Senin, jam 03.00 UTC (tiap 7 hari)
  workflow_dispatch:

env:
  APP_NAME:       "intellij-idea"
  JETBRAINS_CODE: "IIU"           # Unified IntelliJ IDEA
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/intellij-idea.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get upstream latest version (JetBrains API)
        id: upstream
        run: |
          JSON=$(curl -s \
            "https://data.services.jetbrains.com/products/releases?code=${{ env.JETBRAINS_CODE }}&latest=true&type=release")
          VER=$(echo "$JSON" | jq -r '.["${{ env.JETBRAINS_CODE }}"][0].version')
          DL_URL=$(echo "$JSON" | jq -r '.["${{ env.JETBRAINS_CODE }}"][0].downloads.linux.link')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "url=$DL_URL" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $VER"
          echo "  URL: $DL_URL"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/package/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '.builds.latest.source_package.version // "none"')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm build-essential wget
          pip install copr-cli --quiet

      - name: Download tar.gz
        if: steps.check.outputs.skip == 'false'
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          wget -q "${{ steps.upstream.outputs.url }}" -O "idea-${VER}.tar.gz"

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          cp "idea-${VER}.tar.gz" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/${{ env.APP_NAME }}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Submit to COPR
        if: steps.check.outputs.skip == 'false'
        run: copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }}

name: "nuclear - COPR Auto Build"

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari, jam 07.00 WIB (00:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build paksa walaupun versi sama (mis. setelah ubah spec)'
        type: boolean
        default: false
env:
  APP_NAME:       "nuclear"
  GITHUB_REPO:    "nukeop/nuclear"
  COPR_PROJECT:   "Mindset-Apps"
  SPEC_FILE:      "specs/nuclear.spec"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get upstream latest version
        id: upstream
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -fsSL --retry 3 "https://api.github.com/repos/${{ env.GITHUB_REPO }}/releases/latest")
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags "https://github.com/${{ env.GITHUB_REPO }}.git" \
              | awk -F/ '{print $3}' | grep -E '^player@[0-9]' | sort -V | tail -1)
          fi
          [ -z "$TAG" ] && { echo "⚠ No release found — skipping."; echo "skip=true" >> $GITHUB_OUTPUT; exit 0; }
          # Tag upstream memakai bentuk "player@1.51.2".
          VER="${TAG#player@}"
          VER="${VER#v}"
          RPM_EXISTS=$(echo "$RELEASE_JSON" | jq -r --arg pat "Nuclear-${VER}-1.x86_64.rpm" \
            '[.assets[]? | select(.name == $pat)] | length')
          if [ "$RPM_EXISTS" = "0" ]; then
            echo "⚠ Upstream $VER has no x86_64 RPM — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "▶ Upstream: $TAG"

      - name: Get current COPR version
        id: copr
        run: |
          CURRENT=$(curl -s \
            "https://copr.fedorainfracloud.org/api_3/build/list/?ownername=${{ secrets.COPR_USERNAME }}&projectname=${{ env.COPR_PROJECT }}&packagename=${{ env.APP_NAME }}" \
            | jq -r '[.items[] | select(.state == "succeeded") | .source_package.version][0] // "none"')
          CURRENT="${CURRENT%-*}"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "▶ COPR: $CURRENT"

      - name: Smart Skip
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.skip }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          UP="${{ steps.upstream.outputs.version }}"
          CP="${{ steps.copr.outputs.version }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "🔨 Force build diminta (versi $UP)"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$UP" = "$CP" ]; then
            echo "✅ Up-to-date ($UP), skip."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🆕 Update $CP → $UP"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm cpio zstd curl jq
          pip install copr-cli --quiet

      - name: Download & unpack upstream RPM
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.upstream.outputs.tag }}"
          curl -fsSL --retry 3 \
            "https://github.com/${{ env.GITHUB_REPO }}/releases/download/${TAG}/Nuclear-${VER}-1.x86_64.rpm" \
            -o nuclear.rpm
          mkdir -p pkg
          (cd pkg && rpm2cpio ../nuclear.rpm | cpio -idm --quiet)
          mv pkg "nuclear-${VER}"
          tar -czf "nuclear-${VER}.tar.gz" "nuclear-${VER}"
          echo "TARBALL=nuclear-${VER}.tar.gz" >> $GITHUB_ENV

      - name: Build SRPM
        if: steps.check.outputs.skip == 'false'
        id: srpm
        run: |
          set -euo pipefail
          VER="${{ steps.upstream.outputs.version }}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,SRPMS}
          cp ${{ env.SPEC_FILE }} ~/rpmbuild/SPECS/
          sed -i "s/%{pkg_version}/$VER/g" ~/rpmbuild/SPECS/nuclear.spec
          cp "$TARBALL" ~/rpmbuild/SOURCES/
          rpmbuild -bs ~/rpmbuild/SPECS/nuclear.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/*.src.rpm)
          echo "path=$SRPM" >> $GITHUB_OUTPUT

      - name: Setup COPR credentials
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          username = ${{ secrets.COPR_USERNAME }}
          login    = ${{ secrets.COPR_LOGIN }}
          token    = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Sync COPR project chroots
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/sync-copr-chroots
        with:
          project: ${{ env.COPR_PROJECT }}

      - name: Submit to COPR
        id: submit
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          OUT=$(copr-cli build ${{ env.COPR_PROJECT }} ${{ steps.srpm.outputs.path }} 2>&1)
          RC=$?
          printf '%s\n' "$OUT"
          BID=$(printf '%s\n' "$OUT" | grep -oE 'Created builds: [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "build_id=${BID:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build COPR ${BID:-unknown} gagal, log chroot akan ditampilkan di bawah"
          fi
          exit $RC

      - name: Dump COPR chroot log
        if: always() && steps.check.outputs.skip == 'false' && steps.submit.outputs.ok == 'false'
        uses: ./.github/actions/dump-copr-log
        with:
          build-id: ${{ steps.submit.outputs.build_id }}

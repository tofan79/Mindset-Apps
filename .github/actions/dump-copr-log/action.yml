name: Dump COPR chroot log
description: Ambil log build COPR yang gagal dan cetak ke log GitHub Actions

inputs:
  build-id:
    description: "ID build COPR (dari output copr-cli build)"
    required: true
  chroots:
    description: "Chroot yang ingin log-nya ditampilkan, dipisah koma"
    required: false
    default: "fedora-44-x86_64"

runs:
  using: composite
  steps:
    - name: Fetch chroot logs
      shell: bash
      env:
        BID: ${{ inputs.build-id }}
        CHROOT_LIST: ${{ inputs.chroots }}
        COPR_URL: https://copr.fedorainfracloud.org
        DL_URL: https://download.copr.fedorainfracloud.org
      run: |
        set -uo pipefail

        if [ -z "${BID}" ] || [ "${BID}" = "unknown" ]; then
          echo "Tidak ada build-id, lewati."
          exit 0
        fi

        # Log build COPR ternyata bisa dibaca tanpa login, jadi composite
        # action ini tidak memakai konteks secrets sama sekali.
        # Owner, project, dan nama paket diambil dari API publik build tersebut.
        DETAIL=$(curl -sS --max-time 30 "${COPR_URL}/api_3/build/${BID}/" 2>/dev/null || true)
        STATE=$(printf '%s' "${DETAIL}" | jq -r '.state // empty' 2>/dev/null || true)
        OWNER=$(printf '%s' "${DETAIL}" | jq -r '.ownername // empty' 2>/dev/null || true)
        PROJ=$(printf '%s' "${DETAIL}" | jq -r '.project_dirname // empty' 2>/dev/null || true)
        PKG=$(printf '%s' "${DETAIL}" | jq -r '.source_package.name // empty' 2>/dev/null || true)

        echo "::group::COPR build ${BID} state=${STATE:-unknown} (${OWNER:-?}/${PROJ:-?}/${PKG:-?})"
        echo "Halaman build: ${COPR_URL}/coprs/${OWNER}/${PROJ}/build/${BID}/"
        echo

        if [ "${STATE}" = "succeeded" ]; then
          echo "Build sukses, tidak ada log failure."
          echo "::endgroup::"
          exit 0
        fi

        if [ -z "${PKG}" ]; then
          echo "::warning::Tidak bisa membaca metadata build ${BID} dari API."
          echo "::endgroup::"
          exit 0
        fi

        # Path yang benar (ditemukan dari HTML halaman build COPR):
        #   /results/<owner>/<project>/<chroot>/<build-id>-<nama-paket>/<file>
        # builder-live.log.gz adalah log rpmbuild lengkap, sedangkan
        # backend.log.gz hanya berisi pemeriksaan mock yang diharapkan.
        FOUND=""
        for CHROOT in ${CHROOT_LIST//,/ }; do
          for FILE in builder-live.log.gz backend.log.gz; do
            URL="${DL_URL}/results/${OWNER}/${PROJ}/${CHROOT}/${BID}-${PKG}/${FILE}"
            CODE=$(curl -sS --max-time 60 -o /tmp/copr-log.gz -w '%{http_code}' "${URL}" 2>/dev/null || echo 000)
            if [ "${CODE}" = "200" ] && gzip -t /tmp/copr-log.gz 2>/dev/null; then
              echo "──── ${CHROOT} / ${FILE} ────"
              # Error asli ada di ujung log; bagian awal cuma persiapan chroot.
              gzip -dc /tmp/copr-log.gz 2>/dev/null | tail -n 120
              FOUND=1
              break 2
            fi
          done
        done

        if [ -z "${FOUND}" ]; then
          echo "::warning::Log untuk build ${BID} (state=${STATE:-unknown}) belum tersedia."
          echo "Buka manual: ${COPR_URL}/coprs/${OWNER}/${PROJ}/build/${BID}/"
        fi
        echo "::endgroup::"
